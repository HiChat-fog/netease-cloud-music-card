name: NeteaseMusic
on:
  push:
    branches:
      - main
    paths:
      - "index.js"
      - "package.json"
      - ".github/workflows/main.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟刷新卡片（只提交 SVG，不会再自触发）

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Setup
        run: npm install
      - name: index.js
        run: |
          set -o pipefail
          node index.js 2>&1 | tee run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USER_ID: 6403910902
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          REPO: "netease-cloud-music-card"
          AUTHOR: "HiChat-fog"
      - name: Save run log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q -b logs
          {
            echo "run failed at $(date -u)"
            echo '```'
            tail -50 "$GITHUB_WORKSPACE/run.log" 2>/dev/null
            echo '```'
          } > run-error.log
          git add -A
          git -c user.name=build-bot -c user.email=bot@users.noreply.github.com commit -qm "netease run error log"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HiChat-fog/netease-cloud-music-card.git" HEAD:logs
      - name: Purge CDN cache
        run: |
          sleep 15
          for f in music-card.svg music-now-dark.svg music-now-light.svg now-playing.json top-albums.json top-albums-history.json; do
            curl -s -X POST "https://purge.jsdelivr.net/gh/HiChat-fog/netease-cloud-music-card@main/$f" || true
          done
