name: NeteaseMusic
on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * *" # 每天更新一次(北京时间 05:45)

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Setup
        run: npm install
      - name: index.js
        run: node index.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USER_ID: 6403910902
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          REPO: "netease-cloud-music-card"
          AUTHOR: "HiChat-fog"
      - name: Purge CDN cache
        run: |
          sleep 15
          curl -s -X POST "https://purge.jsdelivr.net/gh/HiChat-fog/netease-cloud-music-card@main/music-card.svg" || true
