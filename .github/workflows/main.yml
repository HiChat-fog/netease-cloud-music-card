name: NeteaseMusic
on:
  push:
    branches:
      - main
    paths:
      - "index.js"
      - "package.json"
      - ".github/workflows/main.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟刷新卡片（只提交 SVG，不会再自触发）

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Setup
        run: npm install
      - name: index.js
        run: node index.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USER_ID: 6403910902
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          REPO: "netease-cloud-music-card"
          AUTHOR: "HiChat-fog"
      - name: Purge CDN cache
        run: |
          sleep 15
          for f in music-card.svg music-now-dark.svg music-now-light.svg now-playing.json; do
            curl -s -X POST "https://purge.jsdelivr.net/gh/HiChat-fog/netease-cloud-music-card@main/$f" || true
          done
